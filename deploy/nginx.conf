# nginx site for the wravel website, HTTP only. certbot adds the HTTPS listener
# and the redirect from 80 when it runs (deploy/README.md, "First time").
#
# Copied to /etc/nginx/sites-available/wravel-web, not symlinked: certbot
# rewrites the copy in place, so this file stays the plain starting point.
# Replace <site-domain> when copying.

server {
    listen 80;
    server_name <site-domain>;

    root /srv/apps/wravel-web/build/current;

    # nginx drops this in any location that sets an add_header of its own,
    # hence the repeats below.
    add_header X-Frame-Options DENY always;

    # /api/foo -> wravel-server's /foo, same origin, so the browser needs no
    # CORS. The site calls the public, user-facing endpoints as an anonymous
    # visitor: no token is added here, unlike wravel-manage.
    location /api/ {
        proxy_pass http://127.0.0.1:4830/;
        proxy_set_header Host $host;
        # Set, not appended: the API trusts this header, which is safe only
        # because nginx overwrites it with the real client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed file names: safe to cache for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options DENY always;
    }

    # Client-side routes (/support, /privacy, ...) all load index.html, which
    # is never cached, so a deploy shows up on the next page load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
    }
}
